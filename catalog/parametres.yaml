  # ══════════════════════════════════════════════════════════════════════════════
  # TRANCHE 6 — table Timescale `Quotidienne` (climatologie quotidienne MF,
  # contracts/quotidienne-mf-timescale.odcs.yaml), famille `mf_quotidienne`.
  # 23 des 26 colonnes rejoignent des clés existantes (tranches 0/1 ci-dessus,
  # sources ajoutées en place). Les 3 grandeurs ci-dessous n'ont pas d'équivalent :
  # TM (moyenne vraie horaire) et TNTXM ((TN+TX)/2) sont DISTINCTES par construction
  # (cf. site-infoclimat/include/MeteoFrance/quotidiennes.php:556, COALESCE(TNTXM, TM)
  # — un repli de l'une vers l'autre, pas une fusion) ; TAMPLI est une différence de
  # température (TX-TN), pas une température absolue.
  # ══════════════════════════════════════════════════════════════════════════════

  air_temperature_mean:
    cf_standard_name: air_temperature   # même base que air_temperature_min/_max (cell_methods mean, pas de standard name CF distinct)
    unite_si: K
    domaine: {min: 180.0, max: 340.0}
    description_fr: >-
      Moyenne quotidienne des températures horaires sous abri (TM) — moyenne calculée à
      partir des relevés horaires effectivement observés dans la journée, DISTINCTE de
      air_temperature_midrange (TNTXM, moyenne arithmétique des seuls extrêmes TN/TX).
      site-infoclimat/include/MeteoFrance/quotidiennes.php:556 traite TNTXM comme un
      repli (COALESCE) vers TM quand TM est absent, ce qui confirme que ce sont deux
      calculs différents et non des synonymes.
    sources:
      mf_quotidienne: {colonne: TM, unite: degC, facteur: 1, offset: 273.15, duree_s: 86400,
                        note: "« moyenne quotidienne des températures horaires sous abri ». Unité non documentée explicitement par contracts/quotidienne-mf-timescale.odcs.yaml (DDL : double precision, sans commentaire) ; confirmée par la doc source amont (parseCSV.ts), facteur=1 par cohérence avec RR/TN/TX (NOTE-A : « et 1/10 » = précision décimale, pas facteur d'échelle). Source : telechargement-climatologie-meteo-data-gouv/src/csv/quotidiennes/rr-t-vent/parseCSV.ts"}

  air_temperature_midrange:
    cf_standard_name: null   # pas de standard name CF pour la moyenne des seuls extrêmes (« midrange » climatologique) ; distinct de air_temperature (cell_methods mean, qui couvrirait plutôt TM)
    unite_si: K
    domaine: {min: 180.0, max: 340.0}
    description_fr: >-
      Moyenne quotidienne (TN+TX)/2 (TNTXM) — moyenne arithmétique des seuls extrêmes
      journaliers (« midrange »), DISTINCTE de air_temperature_mean (TM, moyenne vraie
      des relevés horaires). Volontairement non fusionnée avec TM malgré la parenté
      sémantique : ce sont deux estimateurs différents de la température moyenne du
      jour, coexistant dans le même enregistrement Quotidienne (cf. note sur
      air_temperature_mean).
    sources:
      mf_quotidienne: {colonne: TNTXM, unite: degC, facteur: 1, offset: 273.15, duree_s: 86400,
                        note: "« moyenne quotidienne (TN+TX)/2 » — calcul arithmétique des extrêmes, pas une moyenne des observations horaires. Unité non documentée explicitement par le contrat ; confirmée par la doc source amont. Source : telechargement-climatologie-meteo-data-gouv/src/csv/quotidiennes/rr-t-vent/parseCSV.ts"}

  air_temperature_range:
    cf_standard_name: null   # pas de standard name CF officiel confirmé pour l'amplitude thermique diurne (DTR climatologique, ETCCDI) — à revérifier
    unite_si: K
    domaine: {min: 0.0, max: 40.0}
    description_fr: >-
      Amplitude thermique quotidienne, écart entre TX et TN quotidiens (TAMPLI) — DELTA
      de température, pas une température absolue. site-infoclimat/include/MeteoFrance/
      quotidiennes.php:718 calcule d'ailleurs COALESCE(TAMPLI, TX-TN), confirmant
      l'identité entre la colonne et le calcul TX-TN.
    sources:
      mf_quotidienne: {colonne: TAMPLI, unite: degC, facteur: 1, offset: 0, duree_s: 86400,
                        note: "« amplitude thermique quotidienne : écart entre TX et TN quotidiens (TX-TN) ». offset=0 volontairement (une différence en °C égale la même différence en K — ne PAS appliquer +273.15, contrairement à toute température absolue de ce fichier). Unité non documentée explicitement par le contrat ; confirmée par la doc source amont et par le calcul PHP de repli. Source : telechargement-climatologie-meteo-data-gouv/src/csv/quotidiennes/rr-t-vent/parseCSV.ts ; site-infoclimat/include/MeteoFrance/quotidiennes.php:718"}

# Colonnes vues et volontairement NON retenues dans ce vocabulaire (traçabilité
# ADR-0004). Reprend le bloc du POC (synop/static/metar/bouees/mae inchangé, SAUF
# bouees : CL, CM, CH, acc_glace, epaisseur_glace, vitesse_glace et hauteur_vagues_5
# sont RETIRÉS de cette liste car désormais modélisés en tranche 4 — laisser une
# colonne à la fois "non retenue" et "définie comme paramètre" serait incohérent.
# nebulosite (bouees) était déjà non_retenu mais rejoint cloud_area_fraction (source
# ajoutée en tranche 0) pour la même raison ; lat/lng restent non_retenus (position
# par observation, cf. ADR-0007 amendée §4.2, colonnes observation.lat/lon dédiées et
# non un paramètre du vocabulaire) ; raw_msg reste hors périmètre (archivistique,
# Bronze).
non_retenus:
  synop: [temps_passe1, temps_passe2, etat_sol, plafond_nuageux, type_nuages, raw_msg, source]
  static: [complements, source]
  metar: [source]
  bouees: [lat, lng, raw_msg]
  mae: [source]
  # Tranche 1 — colonnes wide MF Horaire confirmées NON consommées (mf_data.txt,
  # marquées "--COLONNE--" = absentes de la table mf_data malgré leur présence dans
  # Horaire). ESNEIGE et CHARGENEIGE : le nom ESNEIGE de la table Horaire n'est pas
  # consommé, mais la même sémantique de code EST consommée côté nivo → voir
  # snow_state_code (tranche 5), pas une contradiction.
  mf_horaire: [DIR2, DIF2, UV, UV2, INFRAR2, INS2, TLAGON, TVEGETAUX, ECOULEMENT,
               ESNEIGE, CHARGENEIGE]
  # Tranche 5 — champs nivo hors périmètre météo (codes bulletin avalanche, codes
  # internes sans grandeur physique associée, ou doublons non résolus jugés trop
  # spéculatifs pour être modélisés sans confirmation).
  mf_nivo: [phenspe1, phenspe2, nuage_val, grain_nombre, homogeneite,
            aval_descr, aval_genre, aval_depart, aval_expo, aval_risque]
