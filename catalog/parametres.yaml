# Vocabulaire contrôlé des paramètres d'observation — ADR-0004 (§7 amendée 2026-07-11)
#
# BROUILLON — lot A3, à revoir par une humaine avant fusion. Rigueur > vitesse :
# les zones d'incertitude sont marquées `unite_incertaine: true` plutôt que devinées.
#
# Structure du fichier (5 tranches d'extension, dans l'ordre demandé par le mandat) :
#   0. Entrées existantes du POC (poc-lakehouse-2025/catalog/parametres.yaml +
#      parametres_mf_tr.yaml) — 33 entrées, fusionnées en un seul fichier. Les champs
#      cf_standard_name / unite_si / domaine / description_fr / sources pré-existants
#      sont repris À L'IDENTIQUE. Extension : de nouvelles clés sont ajoutées au bloc
#      `sources:` de plusieurs de ces entrées quand une colonne des tranches 1-5
#      s'avère être la MÊME grandeur (ex. RR1 du Horaire MF = precipitation_amount_1h
#      existant) — sinon on aurait soit une collision de clé, soit une perte de
#      traçabilité pour ~20 colonnes wide MF qui n'ont pas de grandeur distincte.
#      Voir le rapport de restitution pour la discussion de ce choix d'interprétation.
#   1. Colonnes wide MF consommées — table Timescale `Horaire` (historique, 99 colonnes
#      utiles hors indicateurs Q*), doc source site-infoclimat/include/MeteoFrance/docs/
#      H_HTR_I_ITR.txt (section « H »), structure vérifiée contre
#      data-platform/schemas/timescaledb/schema.sql.gz et le contrat
#      contracts/horaire-mf-timescale.odcs.yaml.
#   2. `static.complements` — 33 sous-champs packés (@-séparés), désérialisés par
#      deserialize_complements() dans site-infoclimat/data/complements.inc.php
#      (constat : 33 champs réels, pas 34 — l'audit de traduisibilité comptait large).
#   3. Codes `_H` de `mf_data` (MariaDB, fallback dual-source) — PAS de nouvelles clés :
#      mf_data_{AAAA}_{MM} porte les MÊMES grandeurs que la tranche 1 (mêmes noms MF
#      sans le suffixe _H, cf. site-infoclimat/include/MeteoFrance/docs/mf_data.txt qui
#      liste les deux nomenclatures côte à côte). Cette tranche ajoute donc des sources
#      `mf_data` sur des entrées déjà créées en tranche 1, uniquement pour les champs
#      explicitement cités par l'audit comme lus par mobile-api (W1_H/W2_H, B1_H,
#      TNSOL_H, HNEIGEFI1_H/HNEIGEFI3_H, ETATMER_H). mf_data est en fin de vie planifiée
#      (contracts/mf-data-fallback.odcs.yaml : ~0% de couverture, un seul écrivain vivant
#      hors-sujet ici) — dupliquer une source par entrée n'apportait pas de valeur de
#      gouvernance proportionnée à l'effort.
#   4. Bouées / mer — table MariaDB `bouees_{MM}_d{d}`, DDL avec COMMENT SQL dans
#      site-infoclimat/cron/yearly/creer_tables_annee.php:41-68 (source la plus fiable :
#      commentaires SQL explicites sur les unités/tables OMM).
#   5. Enneigement (nivo) — source-meteofrance-donnees-libres-nivo.odcs.yaml, alimente
#      V5_data_mf.enneigement via cron/enneigement/recup_donneespub_mf.php.
#   6. `mf_quotidienne` — 26 colonnes de mesures de la table Timescale `Quotidienne`
#      (climatologie quotidienne à mensuelle MF, contracts/quotidienne-mf-timescale.odcs.yaml),
#      alimentée par telechargement-climatologie-meteo-data-gouv (mêmes CSV data.gouv que le
#      contrat cite en sourceRepo). 17 colonnes rejoignent des clés EXISTANTES via un bloc
#      `sources: mf_quotidienne:` supplémentaire à duree_s: 86400 (même grandeur, fenêtre
#      journalière — RR→precipitation_amount_24h, TN/TX→air_temperature_min/max,
#      TNSOL/TN50→grass_minimum_temperature_10cm/50cm, DG→duration_of_frost,
#      DRR→duration_of_precipitation_1h [nom de clé hérité, non renommé — hors périmètre],
#      FFM/FF2M→wind_speed/wind_speed_2m, FXY/DXY/FXI/DXI/FXI2/DXI2/FXI3S/DXI3S→les 4 couples
#      wind_speed_of_gust*/wind_from_direction_of_gust*). 6 colonnes (HTN/HTX/HXY/HXI/HXI2/HXI3S)
#      sont des heures d'occurrence pures → `porte_occurrence: true` sur la clé valeur
#      correspondante, PAS d'entrée séparée (ADR-0004 §7) ; au passage, deux gaps
#      pré-existants sont comblés (wind_speed_of_gust_2m/_3s n'avaient pas encore
#      `porte_occurrence: true` alors que mf_horaire HXI2/HFXI3S existent déjà). 3 colonnes
#      sont des grandeurs distinctes sans équivalent → nouvelles clés air_temperature_mean
#      (TM, moyenne vraie horaire), air_temperature_midrange (TNTXM, (TN+TX)/2 — volontairement
#      PAS fusionnée avec TM) et air_temperature_range (TAMPLI, écart TX-TN, offset=0 car
#      delta). Le contrat ne documente explicitement que RR/TN/TX (mm, °C) ; les 17 autres
#      colonnes n'ont ni commentaire d'unité dans le DDL (schemas/timescaledb/schema.sql.gz,
#      toutes `double precision`/`integer`) ni description dans le contrat — l'unité retenue
#      vient de la doc source amont (telechargement-climatologie-meteo-data-gouv/src/csv/
#      quotidiennes/rr-t-vent/parseCSV.ts, qui transcrit la doc MF officielle), facteur=1
#      partout (cf. NOTE-A : la mention MF « et 1/10 » y est une précision décimale, pas un
#      facteur d'échelle — les exemples parseCSV.ts sont déjà des décimaux, ex. RR: 1.1).
#      DG/DRR (durées en minutes) sont marquées `unite_incertaine: true` : seule la doc source
#      amont confirme l'unité, le contrat est muet même indirectement sur ces deux champs.
#
# AVERTISSEMENT DE LECTURE — l'ordre physique du fichier NE suit PAS strictement ces
# 5 tranches : les entrées sont groupées par PROXIMITÉ THÉMATIQUE pour la relecture
# humaine (ex. wind_speed_2m est juste après wind_speed, pas dans le bloc « TRANCHE 1 »
# plus bas). Les commentaires `# TRANCHE N` marquent seulement où commence le GROS des
# entrées propres à chaque tranche qui n'ont pas de parent thématique en tranche 0.
# Décompte exact par tranche : voir le rapport de restitution de l'agent (pas
# reconstituable depuis les seuls marqueurs de section de ce fichier).
#
# ─── NOTE-A — TRANCHÉE le 2026-07-12 : échantillon prod Horaire (1980/1989/2024)
# = unités RÉELLES (°C, hPa), PAS de 1/10 — l'ADR-0004 est à corriger, le contrat
# horaire-mf-timescale faisait foi. Bornes réelles de la table : 1777 → now. ────────────────────────────────────────
# H_HTR_I_ITR.txt (doc MF officielle transcrite dans site-infoclimat) documente les
# colonnes de la table Horaire en convention MF « et 1/10 » (T, RR1, FF, TSV, PMER,
# PSTAT, PMERMIN, TMER, T10-T100, TNSOL, TN50, TCHAUSSEE, HVAGUE, PVAGUE... = valeurs
# entières en dixièmes). Mais :
#   - le contrat contracts/horaire-mf-timescale.odcs.yaml décrit T comme
#     « REAL — Température sous abri (°C) » SANS mention de 1/10 ;
#   - le schéma réel (data-platform/schemas/timescaledb/schema.sql.gz) déclare ces
#     colonnes en `double precision`, compatible avec les deux hypothèses ;
#   - la vue de production `v_quotidienne_realtime` (schema.sql.gz, définition autour de
#     la ligne 1605) UNIONne directement `"Horaire"."T"` avec `"HoraireTempsReel".t` (qui
#     est confirmé en °C réel par le contrat infrahoraire/horaire temps réel) SANS
#     aucune division par 10 — ce qui n'aurait pas de sens si Horaire.T était encore en
#     dixièmes.
# Faisceau d'indices en faveur d'un facteur déjà réel (1) au moment de l'ingestion dans
# Horaire, contredisant la doc source MF sur le fichier brut. Facteur retenu ICI = 1
# (aligné sur le contrat et la vue de prod, « les contrats font foi »), mais chaque
# champ concerné est marqué `unite_incertaine: true` — À CONFIRMER par échantillonnage
# (`SELECT "T","RR1" FROM "Horaire" ORDER BY "AAAAMMJJHH" DESC LIMIT 20`) avant toute
# mise en production du vocabulaire. C'est la plus grosse zone d'incertitude de ce
# brouillon — elle touche ~25 champs numériques continus de la tranche 1.
# ───────────────────────────────────────────────────────────────────────────────────

version: 0.3.0

parametres:

  # ══════════════════════════════════════════════════════════════════════════════
  # TRANCHE 0 — entrées existantes du POC (33), fusion base + overlay TR
  # ══════════════════════════════════════════════════════════════════════════════

  air_temperature:
    cf_standard_name: air_temperature
    unite_si: K
    domaine: {min: 180.0, max: 340.0}
    description_fr: Température de l'air sous abri
    sources:
      synop:  {colonne: temperature, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      static: {colonne: temperature, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      metar:  {colonne: temperature, unite: degC, facteur: 1, offset: 273.15, duree_s: 0,
               note: entier tronqué au degré à la source (tinyint)}
      bouees: {colonne: temperature, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mae:    {colonne: temperature, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_horaire_tr:      {colonne: t,  unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_infrahoraire_tr: {colonne: t,  unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_horaire: {colonne: T, unite: degC, facteur: 1, offset: 273.15, duree_s: 0,
                   note: "CONFIRMÉ 13/07 (échantillon prod : °C réels, NOTE-A par colonne) — NOTE-A TRANCHÉE 2026-07-12 (échantillon prod : unités réelles, facteur=1 confirmé). Source : site-infoclimat/include/MeteoFrance/docs/H_HTR_I_ITR.txt (section H) ; data-platform/contracts/horaire-mf-timescale.odcs.yaml"}
      mf_nivo: {colonne: temperature, unite: K, facteur: 1, offset: 0, duree_s: 0,
                note: "source déjà en Kelvin, offset -273.15 appliqué par le consommateur PHP. Source : data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}

  air_temperature_min:
    cf_standard_name: air_temperature
    unite_si: K
    domaine: {min: 180.0, max: 340.0}
    description_fr: Température minimale sur la période de la source (agrégat min)
    porte_occurrence: true  # cf. ADR-0004 §7 — HTN (mf_horaire), HTN (mf_quotidienne), tn_1h_heure (complements) alimentent dh_occurrence
    sources:
      synop:  {colonne: temperature_min, unite: degC, facteur: 1, offset: 273.15, duree_s: null,
               note: période variable selon heure synoptique (12 h à 06 UTC)}
      static: {colonne: temperature_min, unite: degC, facteur: 1, offset: 273.15, duree_s: null}
      mf_horaire_tr: {colonne: tn, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600}
      mf_horaire: {colonne: TN, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600,
                   note: "CONFIRMÉ 13/07 (échantillon 2024 : −31,0→40,9 °C) — min « dans l'heure ». NOTE-A TRANCHÉE 2026-07-12 (échantillon prod : unités réelles, facteur=1 confirmé). Source : H_HTR_I_ITR.txt section H"}
      complements_1h: {colonne: tn_1h, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600,
                        note: "site-infoclimat/data/complements.inc.php:205 (@Unit °C @Timespan 1h)"}
      mf_nivo_12h: {colonne: tn_12h, unite: K, facteur: 1, offset: 0, duree_s: 43200,
                    note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}
      mf_nivo_24h: {colonne: tn_24h, unite: K, facteur: 1, offset: 0, duree_s: 86400,
                    note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}
      mf_quotidienne: {colonne: TN, unite: degC, facteur: 1, offset: 273.15, duree_s: 86400,
                        note: "« température minimale sous abri (en °C et 1/10) » — min journalier, heure d'occurrence HTN portée par porte_occurrence (pas d'entrée séparée). Unité confirmée explicitement par contracts/quotidienne-mf-timescale.odcs.yaml (property TN : REAL, °C, sans mention 1/10 — cohérent avec NOTE-A). Source : contracts/quotidienne-mf-timescale.odcs.yaml ; telechargement-climatologie-meteo-data-gouv/src/csv/quotidiennes/rr-t-vent/parseCSV.ts"}

  air_temperature_max:
    cf_standard_name: air_temperature
    unite_si: K
    domaine: {min: 180.0, max: 340.0}
    description_fr: Température maximale sur la période de la source (agrégat max)
    porte_occurrence: true  # cf. ADR-0004 §7 — HTX (mf_horaire), HTX (mf_quotidienne), tx_1h_heure (complements) alimentent dh_occurrence
    sources:
      synop:  {colonne: temperature_max, unite: degC, facteur: 1, offset: 273.15, duree_s: null}
      static: {colonne: temperature_max, unite: degC, facteur: 1, offset: 273.15, duree_s: null}
      mf_horaire_tr: {colonne: tx, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600}
      mf_horaire: {colonne: TX, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600,
                   note: "CONFIRMÉ 13/07 (échantillon 2024 : −29,0→41,7 °C) — max « dans l'heure ». NOTE-A TRANCHÉE 2026-07-12 (échantillon prod : unités réelles, facteur=1 confirmé). Source : H_HTR_I_ITR.txt section H"}
      complements_1h: {colonne: tx_1h, unite: degC, facteur: 1, offset: 273.15, duree_s: 3600,
                        note: "site-infoclimat/data/complements.inc.php:212 (@Unit °C @Timespan 1h)"}
      mf_nivo_12h: {colonne: tx_12h, unite: K, facteur: 1, offset: 0, duree_s: 43200,
                    note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}
      mf_nivo_24h: {colonne: tx_24h, unite: K, facteur: 1, offset: 0, duree_s: 86400,
                    note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}
      mf_quotidienne: {colonne: TX, unite: degC, facteur: 1, offset: 273.15, duree_s: 86400,
                        note: "« température maximale sous abri (en °C et 1/10) » — max journalier, heure d'occurrence HTX portée par porte_occurrence (pas d'entrée séparée). Unité confirmée explicitement par contracts/quotidienne-mf-timescale.odcs.yaml (property TX : REAL, °C, sans mention 1/10 — cohérent avec NOTE-A). Source : contracts/quotidienne-mf-timescale.odcs.yaml ; telechargement-climatologie-meteo-data-gouv/src/csv/quotidiennes/rr-t-vent/parseCSV.ts"}

  dew_point_temperature:
    cf_standard_name: dew_point_temperature
    unite_si: K
    domaine: {min: 180.0, max: 320.0}
    description_fr: Température du point de rosée
    sources:
      synop:  {colonne: point_de_rosee, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      static: {colonne: point_de_rosee, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      metar:  {colonne: point_de_rosee, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      bouees: {colonne: point_de_rosee, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_horaire_tr:      {colonne: td, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_infrahoraire_tr: {colonne: td, unite: degC, facteur: 1, offset: 273.15, duree_s: 0}
      mf_horaire: {colonne: TD, unite: degC, facteur: 1, offset: 273.15, duree_s: 0,
                   note: "NOTE-A TRANCHÉE 2026-07-12 (échantillon prod : °C/hPa réels, facteur=1 confirmé). Source : H_HTR_I_ITR.txt section H"}
      mf_nivo: {colonne: point_de_rosee, unite: K, facteur: 1, offset: 0, duree_s: 0,
                note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}

  relative_humidity:
    cf_standard_name: relative_humidity
    unite_si: "%"
    domaine: {min: 0.0, max: 100.0}
    description_fr: Humidité relative
    sources:
      synop:  {colonne: humidite, unite: "%", facteur: 1, offset: 0, duree_s: 0}
      static: {colonne: humidite, unite: "%", facteur: 1, offset: 0, duree_s: 0}
      bouees: {colonne: humidite, unite: "%", facteur: 1, offset: 0, duree_s: 0}
      mf_horaire_tr:      {colonne: u, unite: "%", facteur: 1, offset: 0, duree_s: 0}
      mf_infrahoraire_tr: {colonne: u, unite: "%", facteur: 1, offset: 0, duree_s: 0}
      mf_horaire: {colonne: U, unite: "%", facteur: 1, offset: 0, duree_s: 0,
                   note: "% déjà entier dans la doc source (pas de mention 1/10) — pas d'incertitude ici. Source : H_HTR_I_ITR.txt section H"}
      mf_nivo: {colonne: humidite, unite: "%", facteur: 1, offset: 0, duree_s: 0,
                note: "data-platform/contracts/source-meteofrance-donnees-libres-nivo.odcs.yaml"}

  relative_humidity_min:
    cf_standard_name: relative_humidity
    unite_si: "%"
    domaine: {min: 0.0, max: 100.0}
    description_fr: Humidité relative minimale sur la période de la source (agrégat min, réseau MF extérieur)
    porte_occurrence: true  # HUN
    sources:
      mf_horaire: {colonne: UN, unite: "%", facteur: 1, offset: 0, duree_s: 3600,
                   note: "min « dans l'heure ». Source : H_HTR_I_ITR.txt section H"}

  relative_humidity_max:
    cf_standard_name: relative_humidity
    unite_si: "%"
    domaine: {min: 0.0, max: 100.0}
    description_fr: Humidité relative maximale sur la période de la source (agrégat max, réseau MF extérieur)
    porte_occurrence: true  # HUX
    sources:
      mf_horaire: {colonne: UX, unite: "%", facteur: 1, offset: 0, duree_s: 3600,
                   note: "max « dans l'heure ». Source : H_HTR_I_ITR.txt section H"}

  air_pressure_at_sea_level:
    cf_standard_name: air_pressure_at_sea_level
    unite_si: Pa
    domaine: {min: 87000.0, max: 108500.0}
    description_fr: Pression ramenée au niveau de la mer
    sources:
      synop:  {colonne: pression, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      static: {colonne: pression, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      metar:  {colonne: pression, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      bouees: {colonne: pression, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      mf_horaire_tr:      {colonne: pmer, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      mf_infrahoraire_tr: {colonne: pmer, unite: hPa, facteur: 100, offset: 0, duree_s: 0}
      mf_horaire: {colonne: PMER, unite: hPa, facteur: 100, offset: 0, duree_s: 0,
                   note: "NOTE-A (documenté 1/10 hPa). Source : H_HTR_I_ITR.txt section H"}

  air_pressure_at_sea_level_min_1h:
    cf_standard_name: air_pressure_at_sea_level
    unite_si: Pa
    domaine: {min: 87000.0, max: 108500.0}
    description_fr: Minimum horaire de la pression ramenée au niveau de la mer (PMERMIN)
    sources:
      mf_horaire: {colonne: PMERMIN, unite: hPa, facteur: 100, offset: 0, duree_s: 3600,
                   note: "NOTE-A TRANCHÉE 2026-07-12 (échantillon prod : °C/hPa réels, facteur=1 confirmé). Source : H_HTR_I_ITR.txt section H"}

  tendency_of_air_pressure:
    cf_standard_name: tendency_of_air_pressure
    unite_si: Pa
    domaine: {min: -3000.0, max: 3000.0}
    description_fr: Variation de pression sur 3 heures
    sources:
      synop:  {colonne: pression_variation_3h, unite: hPa, facteur: 100, offset: 0, duree_s: 10800}
      static: {colonne: pression_variation_3h, unite: hPa, facteur: 100, offset: 0, duree_s: 10800}
      bouees: {colonne: pression_variation_3h, unite: hPa, facteur: 100, offset: 0, duree_s: 10800}

  visibility_in_air:
    cf_standard_name: visibility_in_air
    unite_si: m
    domaine: {min: 0.0, max: 100000.0}
    description_fr: Visibilité horizontale
    sources:
      synop:  {colonne: visibilite, unite: m, facteur: 1, offset: 0, duree_s: 0}
      static: {colonne: visibilite, unite: m, facteur: 1, offset: 0, duree_s: 0}
      metar:  {colonne: visibilite, unite: m, facteur: 1, offset: 0, duree_s: 0,
               note: 9999 = « 10 km ou plus » (valeur censurée, pas une mesure)}
      bouees: {colonne: visibilite, unite: m, facteur: 1, offset: 0, duree_s: 0}
      mf_horaire_tr:      {colonne: vv, unite: m, facteur: 1, offset: 0, duree_s: 0}
      mf_infrahoraire_tr: {colonne: vv, unite: m, facteur: 1, offset: 0, duree_s: 0}
      mf_horaire: {colonne: VV, unite: m, facteur: 1, offset: 0, duree_s: 0,
                   note: "en m, pas de mention 1/10. Source : H_HTR_I_ITR.txt section H"}

  wind_speed:
    cf_standard_name: wind_speed
    unite_si: m s-1
    domaine: {min: 0.0, max: 75.0}
    description_fr: Vitesse du vent moyen (moyenne 10 min)
    sources:
      synop:  {colonne: vent_moyen, unite: km h-1, facteur: 0.2777777778, offset: 0, duree_s: 600}
      static: {colonne: vent_moyen, unite: km h-1, facteur: 0.2777777778, offset: 0, duree_s: 600}
      metar:  {colonne: vent_moyen, unite: km h-1, facteur: 0.2777777778, offset: 0, duree_s: 600,
               note: converti des nœuds à l'acquisition (granularité 1,85 km/h)}
      bouees: {colonne: vent_moyen, unite: km h-1, facteur: 0.2777777778, offset: 0, duree_s: 600}
      mf_horaire_tr:      {colonne: ff, unite: m s-1, facteur: 1, offset: 0, duree_s: 600,
                           note: ff MF nativement en m/s (pas de conversion)}
      mf_infrahoraire_tr: {colonne: ff, unite: m s-1, facteur: 1, offset: 0, duree_s: 600}
      mf_horaire: {colonne: FF, unite: m s-1, facteur: 1, offset: 0, duree_s: 600,
                   note: "NOTE-A (documenté 1/10 m/s). Source : H_HTR_I_ITR.txt section H"}
