apiVersion: v3.0.2
kind: DataContract
id: urn:infoclimat:contract:gold-dataclimat
name: Gold dataclimat (drop-in dataclimat.fr / Data For Good)
version: 0.1.0
status: draft
domain: climato
dataProduct: gold-dataclimat

description:
  purpose: >-
    Les indicateurs climatiques du projet dataclimat.fr (Data For Good) : températures
    journalières et mensuelles par station, records de chaleur et de froid, normales
    1991-2020, et l'Indicateur Thermique National — la température moyenne quotidienne de
    la France. Toutes ces données proviennent de Météo-France.
  usage: >-
    Serving public via /dataclimat/*. Cible : backend dataclimat.fr (remplacement des
    lectures `FROM mv_*` par des appels API). Relevé des règles métier le 2026-07-18 depuis
    leur repo public + API prod (voir chom-poc-data/.superpowers/dataclimat-discovery.md).

tags: [meteo, climatologie, meteofrance, gold, diffusion, dataclimat, dataforgood]

servers:
  - server: diffusion-iceberg
    type: iceberg
    environment: production
    location: s3://chom-ic-lake-diffusion/gold_dataclimat

schema:
  - name: quotidienne
    physicalName: gold_dataclimat.quotidienne
    physicalType: table
    description: >-
      Températures journalières (min, max, moyenne) par station, valeurs officielles
      Météo-France, historique depuis 1816 : pour tracer des courbes de température ou
      alimenter un tableau de bord.
    properties:
      - name: station_code
        physicalType: TEXT
        required: true
        description: NUM_POSTE Météo-France
      - name: date
        physicalType: DATE
        required: true
      - name: tntxm
        physicalType: DOUBLE
        description: Moyenne (tn+tx)/2 — midrange officiel MF (°C)
      - name: tn
        physicalType: DOUBLE
        description: Température minimale du jour climatologique (°C)
      - name: tx
        physicalType: DOUBLE
        description: Température maximale du jour climatologique (°C)

  - name: mensuelle
    physicalName: gold_dataclimat.mensuelle
    physicalType: table
    description: >-
      Le résumé de chaque mois par station — moyenne et extrêmes (jour le plus froid /
      le plus chaud) : pour des bilans mensuels.
    properties:
      - name: station_code
        physicalType: TEXT
        required: true
        description: NUM_POSTE Météo-France
      - name: date
        physicalType: DATE
        required: true
        description: Mois (premier jour du mois)
      - name: tnn
        physicalType: DOUBLE
        description: Tn minimale du mois (°C)
      - name: tnn_date
        physicalType: DATE
        description: Jour du Tn minimal (tie-break date la plus ancienne)
      - name: txx
        physicalType: DOUBLE
        description: Tx maximale du mois (°C)
      - name: txx_date
        physicalType: DATE
        description: Jour du Tx maximal
      - name: tmm
        physicalType: DOUBLE
        description: Moyenne mensuelle de tntxm, arrondie à 0,1 °C

  - name: records_absolus
    physicalName: gold_dataclimat.records_absolus
    physicalType: table
    description: >-
      Les records de température (chaud/froid) de chaque station, toute l'année / par
      mois / par saison : pour afficher « record battu » et les extrêmes historiques.
    properties:
      - name: period_type
        physicalType: TEXT
        required: true
        description: all_time | month | season
      - name: period_value
        physicalType: TEXT
        description: NULL (all_time) | '1'..'12' (mois) | spring|summer|autumn|winter
      - name: record_type
        physicalType: TEXT
        required: true
        description: TX (chaud) | TN (froid)
      - name: station_code
        physicalType: TEXT
        required: true
        description: NUM_POSTE Météo-France
      - name: station_name
        physicalType: TEXT
      - name: department
        physicalType: TEXT
      - name: record_value
        physicalType: DOUBLE
        description: Valeur du record (°C)
      - name: record_date
        physicalType: DATE
        description: Date du record (tie-break date la plus ancienne)
      - name: lat
        physicalType: DOUBLE
      - name: lon
        physicalType: DOUBLE
      - name: alt
        physicalType: DOUBLE

  - name: itn
    physicalName: gold_dataclimat.itn
    physicalType: table
    description: >-
      L'Indicateur Thermique National — la température moyenne quotidienne de la France
      (30 stations de référence) : pour suivre vagues de chaleur et de froid à l'échelle
      du pays.
    properties:
      - name: date
        physicalType: DATE
        required: true
      - name: year
        physicalType: INTEGER
      - name: month
        physicalType: INTEGER
      - name: day_of_month
        physicalType: INTEGER
      - name: is_fictive
        physicalType: BOOLEAN
        description: TRUE si 29 février synthétique (année non bissextile)
      - name: itn
        physicalType: DOUBLE
        description: Indicateur Thermique National du jour (°C)

  - name: itn_baseline
    physicalName: gold_dataclimat.itn_baseline
    physicalType: table
    description: >-
      La normale 1991-2020 de l'ITN, jour par jour : la référence pour dire si une
      journée est au-dessus ou en dessous de la normale nationale.
    properties:
      - name: month
        physicalType: INTEGER
        required: true
      - name: day_of_month
        physicalType: INTEGER
        required: true
      - name: sample_size
        physicalType: INTEGER
      - name: itn_mean
        physicalType: DOUBLE
      - name: itn_stddev
        physicalType: DOUBLE
        description: Écart-type de population (STDDEV_POP)
      - name: itn_p20
        physicalType: DOUBLE
      - name: itn_p80
        physicalType: DOUBLE

  - name: baseline_1991_2020
    physicalName: gold_dataclimat.baseline_1991_2020
    physicalType: table
    description: >-
      La normale de température 1991-2020 de chaque station, jour par jour de l'année :
      pour calculer l'écart à la normale.
    properties:
      - name: station_code
        physicalType: TEXT
        required: true
        description: NUM_POSTE Météo-France
      - name: month
        physicalType: INTEGER
        required: true
      - name: day
        physicalType: INTEGER
        required: true
      - name: sample_count
        physicalType: INTEGER
        description: Nombre d'années contributrices (>= 24)
      - name: baseline_mean_tntxm
        physicalType: DOUBLE
        description: Moyenne 1991-2020 de tntxm pour ce jour calendaire (°C)

  - name: first_temperature_date
    physicalName: gold_dataclimat.first_temperature_date
    physicalType: table
    description: >-
      Depuis quel mois chaque station mesure la température : pour connaître
      l'ancienneté d'une station. La date est un texte au format AAAAMM (année
      puis mois sur deux chiffres) — par exemple « 187206 » = juin 1872.
    properties:
      - name: station_code
        physicalType: TEXT
        required: true
        description: NUM_POSTE Météo-France
      - name: first_temperature_date
        physicalType: TEXT
        description: >-
          Mois du premier relevé de température, texte au format AAAAMM (année +
          mois sur deux chiffres), ex. « 187206 » = juin 1872. Ni date ISO ni
          nombre.

customProperties:
  - property: lineage
    value: >-
      silver.observation_v2 (source mf-q/mf-h) -> gold_dataclimat.quotidienne ->
      {mensuelle, records_absolus, itn, itn_baseline, baseline_1991_2020, first_temperature_date}
  - property: dataLicense
    value: >-
      Données source Météo-France, Licence Ouverte (Etalab) 2.0 (data.gouv.fr). Méthodologie
      des agrégats : Data For Good, saison 14 (dataforgoodfr/14_ValorisationDonneeMeteo).
  - property: attribution
    value: Météo-France
  - property: methodologyRef
    value: >-
      github.com/dataforgoodfr/14_ValorisationDonneeMeteo (backend/sql/materialized_views).
      Règles reproduites en drop-in ; déviations documentées (classe_recente absente du lac).
  - property: deviations
    value: >-
      classe_recente (classification d'homogénéité MF) non disponible dans le lac : filtres
      classe_recente<=3 (records) et <=4 (baseline) non appliqués, colonne classe_recente omise.
      À réintroduire quand la classification station sera sourcée (mutualisé chantier StatIC).
