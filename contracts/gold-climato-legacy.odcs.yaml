apiVersion: v3.0.2
kind: DataContract
id: urn:infoclimat:contract:gold-climato-legacy
name: Gold climato legacy (copie MF retro-compat)
version: 0.1.0
status: draft
domain: climato
dataProduct: gold-climato-legacy

description:
  purpose: >-
    Produits Gold retro-compat : copie fidèle des tables climato Météo-France
    (schéma complet, unités MF natives), publiée sur le bucket diffusion.
  usage: Serving public via climato.chom.engineering /legacy/*

tags:
  - meteo
  - climatologie
  - meteofrance
  - gold
  - diffusion

servers:
  - server: diffusion-iceberg
    type: iceberg
    environment: production
    location: s3://chom-ic-lake-diffusion/gold_legacy

schema:
  - name: mensuelle
    physicalName: gold_legacy.mensuelle
    physicalType: table
    description: Climatologie mensuelle MF (schéma complet, unités natives)
    properties:
      - name: NUM_POSTE
        physicalType: TEXT
        required: true
      - name: AAAAMM
        physicalType: TIMESTAMPTZ
        required: true

  - name: decadaire
    physicalName: gold_legacy.decadaire
    physicalType: table
    description: Climatologie décadaire MF (schéma complet, unités natives)
    properties:
      - name: NUM_POSTE
        physicalType: TEXT
        required: true
      - name: AAAAMM
        physicalType: TIMESTAMPTZ
        required: true
      - name: NUM_DECADE
        physicalType: INTEGER
        required: true
        description: 3e composante de la clé naturelle (1/2/3, 3 décades par mois)

  - name: decadaire_agro
    physicalName: gold_legacy.decadaire_agro
    physicalType: table
    description: Climatologie décadaire agrométéo MF (schéma complet, unités natives)
    properties:
      - name: NUM_POSTE
        physicalType: TEXT
        required: true
      - name: AAAAMM
        physicalType: TIMESTAMPTZ
        required: true
      - name: NUM_DECADE
        physicalType: INTEGER
        required: true
        description: 3e composante de la clé naturelle (1/2/3, 3 décades par mois)

team:
  - username: pam
    role: owner

support:
  - channel: data
    tool: email
    url: mailto:pamahe@proton.me

customProperties:
  - property: lineage
    value: bronze.mf_mensuelle -> gold_legacy.mensuelle
  - property: dataLicense
    value: >-
      Données source Météo-France, Licence Ouverte (Etalab) 2.0
      (meteo.data.gouv.fr) — attribution Météo-France requise.
  - property: attribution
    value: Météo-France / Infoclimat
