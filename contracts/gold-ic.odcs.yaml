apiVersion: v3.0.2
kind: DataContract
id: urn:infoclimat:contract:gold-ic
name: Gold collecte IC (climatologie des sources collectées par Infoclimat, hors Météo-France)
version: 0.1.0
status: draft
domain: climato
dataProduct: gold-ic

description:
  purpose: >-
    Les agrégats climatologiques calculés sur TOUTES les sources collectées par
    Infoclimat À L'EXCLUSION du flux officiel Météo-France : réseaux synoptiques et
    METAR officiels (décodés depuis les diffusions internationales SYNOP/BUFR),
    bouées marines, le réseau participatif StatIC et Météo-à-l'École. Ce n'est donc
    PAS un réseau propre à Infoclimat mais l'ensemble de sa collecte hors
    Météo-France — un regroupement technique par source. Pour les SEULES stations
    opérées par Infoclimat, voir gold-statIC (réseau participatif). Températures
    journalières et mensuelles, records par station ; QC et unités (°C, mm)
    identiques à v2.
  usage: Serving public via climato.chom.engineering /ic/*

tags:
  - meteo
  - climatologie
  - infoclimat
  - collecte-multi-sources
  - gold
  - diffusion
  - schema-canonique

servers:
  - server: diffusion-iceberg
    type: iceberg
    environment: production
    location: s3://chom-ic-lake-diffusion/gold_ic

schema:
  - name: journaliere
    physicalName: gold_ic.journaliere
    physicalType: table
    description: >-
      Températures journalières (min, max, moyenne) et cumul de précipitation par
      station, en °C et mm, à partir des sources collectées par Infoclimat hors
      Météo-France (synop/metar/bouées officiels relayés + StatIC + Météo-à-l'École).
      Contrôle qualité qui écarte les valeurs aberrantes.
    properties:
      - name: ic_id
        physicalType: TEXT
        required: true
        description: Identifiant station Infoclimat (crosswalk dim_station)
      - name: mfid
        physicalType: TEXT
        description: NUM_POSTE Météo-France si la station est aussi référencée MF, sinon vide
      - name: date
        physicalType: DATE
        required: true
      - name: tn
        physicalType: DOUBLE
        description: Température min du jour (°C)
      - name: tx
        physicalType: DOUBLE
        description: Température max du jour (°C)
      - name: tm
        physicalType: DOUBLE
        description: (tn+tx)/2 (°C)
      - name: tntxm
        physicalType: DOUBLE
        description: alias de tm (°C)
      - name: rr
        physicalType: DOUBLE
        description: Cumul de précipitation du jour (mm)

  - name: mensuelle
    physicalName: gold_ic.mensuelle
    physicalType: table
    description: >-
      Le résumé de chaque mois par station — moyennes, extrêmes datés (jour le plus
      froid / le plus chaud), nombre de jours de gel — sur les sources collectées par
      Infoclimat hors Météo-France.
    properties:
      - name: ic_id
        physicalType: TEXT
        required: true
      - name: mfid
        physicalType: TEXT
        description: NUM_POSTE Météo-France si la station est aussi référencée MF, sinon vide
      - name: mois
        physicalType: TIMESTAMP
        required: true
        description: Premier jour du mois (date_trunc('month', date))
      - name: tnm
        physicalType: DOUBLE
        description: Moyenne mensuelle des tn (°C)
      - name: txm
        physicalType: DOUBLE
        description: Moyenne mensuelle des tx (°C)
      - name: tmm
        physicalType: DOUBLE
        description: Moyenne mensuelle des tm (°C)
      - name: rr
        physicalType: DOUBLE
        description: Cumul de précipitation du mois (mm)
      - name: tnn
        physicalType: DOUBLE
        description: Température min du mois (°C)
      - name: tnn_date
        physicalType: DATE
      - name: txx
        physicalType: DOUBLE
        description: Température max du mois (°C)
      - name: txx_date
        physicalType: DATE
      - name: nb_jours_gel
        physicalType: INTEGER
        description: Nombre de jours du mois avec tn < 0 °C

  - name: records
    physicalName: gold_ic.records
    physicalType: table
    description: >-
      Les records de température (chaud/froid) de chaque station, par mois calendaire
      sur tout l'historique, sur les sources collectées par Infoclimat hors
      Météo-France : pour afficher « record battu » et les extrêmes historiques.
    properties:
      - name: ic_id
        physicalType: TEXT
        required: true
      - name: mfid
        physicalType: TEXT
        description: NUM_POSTE Météo-France si la station est aussi référencée MF, sinon vide
      - name: mois_calendaire
        physicalType: INTEGER
        required: true
        description: Mois calendaire (1-12), 3e composante de la clé naturelle
      - name: txx_max
        physicalType: DOUBLE
        description: Record absolu de température max sur le mois calendaire (°C)
      - name: txx_max_date
        physicalType: DATE
      - name: tnn_min
        physicalType: DOUBLE
        description: Record absolu de température min sur le mois calendaire (°C)
      - name: tnn_min_date
        physicalType: DATE

team:
  - username: pam
    role: owner

support:
  - channel: data
    tool: email
    url: mailto:pamahe@proton.me

customProperties:
  - property: lineage
    value: silver.observation_v2 (source LIKE '%-ic') -> gold_ic.journaliere -> {mensuelle, records}
  - property: dataLicense
    value: >-
      Sources multiples collectées par Infoclimat hors Météo-France : réseaux
      officiels SYNOP/METAR/bouées (diffusions internationales) et réseaux
      participatifs StatIC / Météo-à-l'École, redistribués sous la politique
      opendata Infoclimat. Les données officielles restent sous la licence de leur
      producteur.
  - property: attribution
    value: Infoclimat (collecte multi-sources hors Météo-France)
  - property: methodologyRef
    value: >-
      Kernels identiques à gold_v2 (github.com/dataforgoodfr/14_ValorisationDonneeMeteo,
      backend/sql) — mêmes agrégats journaliers/mensuels/records, appliqués aux seules
      sources IC.
  - property: sourceFilter
    value: >-
      source LIKE '%-ic' : synop-ic (SYNOP officiel relayé), metar-ic (METAR),
      bouees-ic (bouées), static-ic (StatIC participatif), mae-ic (Météo-à-l'École).
      Exclut les sources Météo-France (mf-*) et les anciens agrégats IC (climato-auto).
  - property: units
    value: >-
      Unités conventionnelles (°C, mm). QC de plausibilité physique appliqué en amont
      de gold_ic.journaliere (air_temperature ∈ [-90, +60] °C, précipitation horaire
      ∈ [0, 500] mm) — hérité par mensuelle/records.
